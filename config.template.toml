#:schema https://developers.openai.com/codex/config-schema.json
# Portable preferences only. ./install.sh installs skills and MCP plugins.

model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
service_tier = "default"
personality = "pragmatic"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
default_permissions = "projects-write"
web_search = "live"

[permissions.projects-write]
extends = ":workspace"

[permissions.projects-write.network]
enabled = true

[features]
multi_agent = true
