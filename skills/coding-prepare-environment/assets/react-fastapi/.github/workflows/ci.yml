name: Check starter
on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - run: |
          python3 deployments/setup.py
          uv sync --project backend --frozen
          npm --prefix frontend/app ci
      - run: bash backend/check.sh
      - run: bash frontend/app/check.sh
      - run: python3 deployments/render_k8s.py --backend-image example.com/app/backend:ci --web-image example.com/app/web:ci --domain app.example.com --namespace app-ci --release ci --ingress-class nginx --output build/k8s-ci
      - run: |
          docker compose --env-file deployments/dev/.env -f deployments/compose.base.yaml -f deployments/dev/compose.yaml up --build -d --wait
          python3 deployments/dev/smoke.py http://127.0.0.1:8080
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend/app
      - if: failure()
        run: docker compose --env-file deployments/dev/.env -f deployments/compose.base.yaml -f deployments/dev/compose.yaml logs --tail=100
      - if: always()
        run: docker compose --env-file deployments/dev/.env -f deployments/compose.base.yaml -f deployments/dev/compose.yaml down
