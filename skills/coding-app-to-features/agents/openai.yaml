interface:
  display_name: "CODING | App To Features"
  short_description: "Shape app context and decided vertical features."
  default_prompt: >-
    Use $coding-app-to-features. Infer safe defaults first, ask only about unresolved
    contract-changing choices with no safe default, challenge the app idea, state decisions, and
    derive the complete non-speculative feature set, keep every feature lean, and route every
    decided feature through normal feature-spec and executable proof authoring without approval gates. Route from
    the requested deliverable: contract authoring stops after preparation and requires a separate
    explicit implementation request; only an original request for implemented product behavior
    continues into serial priority-ordered feature execution in the same run.
policy:
  allow_implicit_invocation: true
