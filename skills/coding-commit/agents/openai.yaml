interface:
  display_name: "CODING | Commit"
  short_description: "Create coherent commits; push on explicit request."
  default_prompt: "Use $coding-commit to inspect repository changes, including changes from other tasks, and create coherent local Conventional Commits. Run $coding-privacy-audit on the selected changes before public-repository commits; the audit is optional for private repositories. Push only when explicitly requested."
policy:
  allow_implicit_invocation: true
