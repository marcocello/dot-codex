[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[project]
name = "secondbrain-context"
version = "0.1.0"
description = "Scoped Outlook and WhatsApp ingestion with private local retrieval."
requires-python = ">=3.11,<3.14"
dependencies = [
    "msal>=1.34,<2",
    "qdrant-client>=1.16,<2",
    "fastembed>=0.7,<1",
    "mcp>=1.30,<2",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
test = ["pytest>=9,<10"]
pinecone = ["pinecone>=10.2,<11"]

[project.scripts]
secondbrain-context = "secondbrain_context.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/secondbrain_context"]

[tool.pytest.ini_options]
testpaths = ["tests"]
