name: Check starter
on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - run: make setup check
      - run: python3 scripts/render_k8s.py --backend-image example.com/app/backend:ci --web-image example.com/app/web:ci --domain app.example.com --namespace app-ci --release ci --ingress-class nginx --output build/k8s-ci
      - run: make up smoke
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend/app
      - if: failure()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down
