interface:
  display_name: "CODING | App To Features"
  short_description: "Shape app context and decided vertical features."
  default_prompt: >-
    Use $coding-app-to-features. Infer safe defaults first, ask only about unresolved
    contract-changing choices with no safe default, challenge the app idea, state decisions, and
    create the smallest decision-ready vertical feature queue without approval gates. For a
    create/build/implement request, continue into the first ready feature in the same run.
policy:
  allow_implicit_invocation: true
